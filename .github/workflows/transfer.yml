name: Copy OneDrive to Google Drive

on:
  schedule:
    # Tu dong chay dinh ky neu can
    - cron: '30 0 1 11 *'
  workflow_dispatch:
    inputs:
      onedrive_src_path:
        description: 'Thư mục gốc OneDrive (Để trống = Copy TOÀN BỘ OneDrive, VD: Documents/Work)'
        required: false
        default: ''
        type: string
      gdrive_dst_path:
        description: 'Thư mục đích trên Google Drive (Mặc định: Backup_OneDrive)'
        required: false
        default: 'Backup_OneDrive'
        type: string
      transfers:
        description: 'Số luồng copy song song (Mặc định: 10)'
        required: false
        default: '10'
        type: string
      run_attempt_chain:
        description: 'Số thứ tự phiên chạy nối tiếp (Tự động tăng)'
        required: false
        default: '1'
        type: string

permissions:
  contents: read
  actions: write

jobs:
  transfer-data:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Giới hạn 5h50p của GitHub Actions

    steps:
      - name: 1. Cài đặt Rclone mới nhất
        run: |
          sudo -v ; curl https://rclone.org/install.sh | sudo bash
          rclone version

      - name: 2. Nạp cấu hình đăng nhập (Từ GitHub Secret RCLONE_CONFIG)
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if [ -z "$RCLONE_CONFIG_CONTENT" ]; then
            echo "❌ LỖI: Bạn chưa thêm Secret 'RCLONE_CONFIG' trong Settings -> Secrets and variables -> Actions!"
            exit 1
          fi
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf
          echo "✔ Đã nạp các kết nối:"
          rclone listremotes

      - name: 3. Copy dữ liệu (Tự động bỏ qua file đã tồn tại & chạy tối đa 320m)
        id: transfer_step
        run: |
          SRC_SUB="${{ inputs.onedrive_src_path }}"
          DST_SUB="${{ inputs.gdrive_dst_path }}"
          TRANSFERS="${{ inputs.transfers }}"
          CHAIN="${{ inputs.run_attempt_chain }}"

          if [[ "$SRC_SUB" == http* ]]; then
            SRC_SUB=""
          fi
          if [ -z "$DST_SUB" ] || [[ "$DST_SUB" == http* ]]; then
            DST_SUB="Backup_OneDrive"
          fi
          if [ -z "$TRANSFERS" ]; then
            TRANSFERS="10"
          fi
          if [ -z "$CHAIN" ]; then
            CHAIN="1"
          fi

          if [ -z "$SRC_SUB" ]; then
            SRC="onedrive_src:"
          else
            SRC="onedrive_src:${SRC_SUB#/}"
          fi
          DST="gdrive_dst:${DST_SUB#/}"

          echo "======================================================"
          echo "🚀 BẮT ĐẦU CHUYỂN DỮ LIỆU (PHIÊN NỐI TIẾP #$CHAIN)"
          echo "   • Nguồn (OneDrive)    : $SRC"
          echo "   • Đích (Google Drive) : $DST"
          echo "   • Luồng chạy song song: $TRANSFERS"
          echo "   • Cơ chế chống trùng  : Bỏ qua file đã tồn tại khớp dung lượng/thời gian"
          echo "======================================================"

          set +e
          # Chạy tối đa 5 tiếng 20 phút (320m). Loại trừ Personal Vault (Két sắt bảo mật 2FA của OneDrive) để tránh treo retry
          rclone copy "$SRC" "$DST" \
            --exclude "/Personal Vault/**" \
            --exclude "Personal Vault" \
            --transfers "$TRANSFERS" \
            --checkers 16 \
            --create-empty-src-dirs \
            --drive-chunk-size 64M \
            --max-duration 320m \
            --cutoff-mode soft \
            --retries 2 \
            --low-level-retries 5 \
            --stats 15s \
            --stats-one-line \
            -v
          RCLONE_EXIT=$?
          echo "Rclone kết thúc với mã: $RCLONE_EXIT"

          if [ "$RCLONE_EXIT" -eq 0 ]; then
            echo "🎉 ĐÃ COPY ĐẦY ĐỦ 100% DỮ LIỆU! Không còn file nào bị thiếu."
            echo "need_rerun=false" >> $GITHUB_OUTPUT
          else
            echo "⏳ Đã chạm mốc thời gian phiên hiện tại (Exit code: $RCLONE_EXIT). Vẫn còn dữ liệu cần copy tiếp!"
            echo "🔄 Sẽ tự động kích hoạt máy ảo GitHub tiếp theo ngay lập tức!"
            echo "need_rerun=true" >> $GITHUB_OUTPUT
          fi
          set -e

      - name: 4. Tự động kích hoạt máy ảo kế tiếp nếu chưa copy xong
        if: always() && (steps.transfer_step.outputs.need_rerun == 'true' || steps.transfer_step.conclusion == 'cancelled')
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          CHAIN="${{ inputs.run_attempt_chain }}"
          if [ -z "$CHAIN" ]; then
            CHAIN="1"
          fi
          NEXT_CHAIN=$((CHAIN + 1))

          if [ "$NEXT_CHAIN" -gt 50 ]; then
            echo "⚠️ Đã đạt giới hạn an toàn 50 phiên chạy liên tiếp. Dừng tự động gọi lại."
            exit 0
          fi

          SRC_VAL="${{ inputs.onedrive_src_path }}"
          if [[ "$SRC_VAL" == http* ]]; then
            SRC_VAL=""
          fi
          DST_VAL="${{ inputs.gdrive_dst_path }}"
          if [ -z "$DST_VAL" ] || [[ "$DST_VAL" == http* ]]; then
            DST_VAL="Backup_OneDrive"
          fi
          TRANSFERS_VAL="${{ inputs.transfers }}"
          if [ -z "$TRANSFERS_VAL" ]; then
            TRANSFERS_VAL="10"
          fi

          echo "🚀 Đang tự động gọi máy ảo GitHub mới (Phiên #$NEXT_CHAIN) để tiếp tục copy..."
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/transfer.yml/dispatches" \
            -d "{
              \"ref\": \"main\",
              \"inputs\": {
                \"onedrive_src_path\": \"$SRC_VAL\",
                \"gdrive_dst_path\": \"$DST_VAL\",
                \"transfers\": \"$TRANSFERS_VAL\",
                \"run_attempt_chain\": \"$NEXT_CHAIN\"
              }
            }"
          echo "✔ Đã kích hoạt Phiên #$NEXT_CHAIN thành công!"
